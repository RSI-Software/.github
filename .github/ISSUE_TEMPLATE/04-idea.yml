name: Idea 💡
description: Capture a possibility that needs evidence or a decision before commitment.
type: Idea 💡
body:
  - type: markdown
    attributes:
      value: |
        ## Preserve the question without pretending it is committed work

        Use an Idea when the direction still needs evidence or a decision. If
        the outcome is understood, choose Feature or Task. Keep the title to the
        possibility itself, without type, status, domain, or homing markers.

  - type: textarea
    id: possibility
    attributes:
      label: Possibility
      description: What might change, and for whom?
      placeholder: We could... so that...
    validations:
      required: true

  - type: textarea
    id: signal
    attributes:
      label: Signal
      description: What observation, pain, or opportunity makes this worth considering?
      placeholder: We observed... This may matter because...
    validations:
      required: true

  - type: textarea
    id: decision_condition
    attributes:
      label: Decision conditions
      description: What evidence or answer would let this issue close, promote, or stop?
      placeholder: |
        - [ ] We know whether...
        - [ ] We can compare...
        - [ ] The next disposition is recorded.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
      description: What could make this a poor direction? What simpler option exists?
      placeholder: Risks... Alternatives...

  - type: markdown
    attributes:
      value: |
        ## Classify it in GitHub

        Before creating the issue, use the native controls below the form.
        Metadata in those controls is authoritative; these checks only record
        that you made the filing decision.

  - type: checkboxes
    id: domain_gate
    attributes:
      label: Domain
      description: Use the native Label picker. Repository-local labels may supplement, but do not replace, a governed domain label.
      options:
        - label: I applied at least one applicable governed domain label.
          required: true

  - type: checkboxes
    id: priority_gate
    attributes:
      label: Priority
      description: Use the native Priority issue field. Priority is human judgment and automation will not infer it.
      options:
        - label: I set Priority, or intentionally left it blank because I cannot honestly judge it yet.
          required: true

  - type: markdown
    attributes:
      value: |
        ### What happens next

        A new human filing enters **Untriaged 📥**. Automation records filing
        provenance and initializes existing governed Project membership. Later
        triage owns parentage, relationships, Standalone, Slice, and homing.

  - type: checkboxes
    id: filing_gate
    attributes:
      label: Filing check
      options:
        - label: I searched open and closed issues for this possibility.
          required: true
        - label: The title describes only the possibility, without taxonomy or status markers.
          required: true
        - label: I have not presented an undecided direction as committed work.
          required: true
