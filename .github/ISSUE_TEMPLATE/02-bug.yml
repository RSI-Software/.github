name: Bug 🐛
description: Report reproducible broken behavior, a regression, or a reliability failure.
type: Bug 🐛
body:
  - type: markdown
    attributes:
      value: |
        ## Make the failure reproducible

        Report one broken behavior. Keep the title to what broke, without type,
        status, domain, or homing markers. Add the smallest useful evidence and
        remove secrets before submitting.

        Agents file via `ghb issue create`, never this form.

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What did you do, and what visible result was wrong?
      placeholder: When I... the system...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the shortest deterministic sequence you know.
      placeholder: |
        1. Start from...
        2. Run or open...
        3. Observe...

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: The system should...

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add a focused log excerpt, trace, screenshot, or recording. Redact secrets and personal paths.
      placeholder: Paste or drag supporting evidence here.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions and surfaces that can affect reproduction.
      value: |
        - OS:
        - App or browser:
        - Version or commit:
        - Provider or runtime:

  - type: input
    id: regression
    attributes:
      label: Last known good version
      description: Optional. Name the last release or commit where this worked.
      placeholder: v1.2.3 or abc1234

  - type: textarea
    id: close_condition
    attributes:
      label: Close conditions
      description: State the restored behavior and the evidence that will prove it.
      placeholder: |
        - [ ] The reproduction no longer fails.
        - [ ] A regression check covers the failure.

  - type: markdown
    attributes:
      value: |
        ## Classify it in GitHub

        Before creating the issue, use the native controls below the form.
        Metadata in those controls is authoritative; these checks only record
        that you made the filing decision.

  - type: checkboxes
    id: domain_gate
    attributes:
      label: Domain
      description: Use the native Label picker. Repository-local labels may supplement, but do not replace, a governed domain label.
      options:
        - label: I applied at least one applicable governed domain label.

  - type: checkboxes
    id: priority_gate
    attributes:
      label: Priority
      description: Use the native Priority issue field. Judge operational urgency, not fix difficulty.
      options:
        - label: I set Priority, or intentionally left it blank because I cannot honestly judge it yet.

  - type: markdown
    attributes:
      value: |
        ### What happens next

        A new human filing enters **Untriaged 📥**. Automation records filing
        provenance and initializes existing governed Project membership. Later
        triage owns parentage, relationships, Standalone, Slice, and homing.

  - type: checkboxes
    id: filing_gate
    attributes:
      label: Filing check
      options:
        - label: I searched open and closed issues and did not find this failure.
        - label: The title describes only the failure, without taxonomy or status markers.
        - label: I removed credentials, tokens, private URLs, and personal paths.
