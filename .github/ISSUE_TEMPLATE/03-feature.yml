name: Feature ✨
description: Define a new user-visible product or workflow capability.
type: Feature ✨
body:
  - type: markdown
    attributes:
      value: |
        ## Describe the capability, not its implementation

        Show the missing workflow and the observable result that should become
        possible. Keep the title to the capability itself, without type, status,
        domain, or homing markers.

  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Who does what, and what becomes possible?
      placeholder: As a... I can... so that...
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: What happens today, and why is it insufficient?
      placeholder: Today... This prevents...
    validations:
      required: true

  - type: textarea
    id: close_condition
    attributes:
      label: Close conditions
      description: List observable outcomes that prove the capability exists.
      placeholder: |
        - [ ] A user can...
        - [ ] The workflow preserves...
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Name compatibility, safety, or scope boundaries that must survive.
      placeholder: Must preserve... Does not include...

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Add a real screenshot, recording, reference, or comparable workflow when useful.
      placeholder: Paste or drag supporting material here.

  - type: markdown
    attributes:
      value: |
        ## Classify it in GitHub

        Before creating the issue, use the native controls below the form.
        Metadata in those controls is authoritative; these checks only record
        that you made the filing decision.

  - type: checkboxes
    id: domain_gate
    attributes:
      label: Domain
      description: Use the native Label picker. Repository-local labels may supplement, but do not replace, a governed domain label.
      options:
        - label: I applied at least one applicable governed domain label.
          required: true

  - type: checkboxes
    id: priority_gate
    attributes:
      label: Priority
      description: Use the native Priority issue field. Priority is human judgment and automation will not infer it.
      options:
        - label: I set Priority, or intentionally left it blank because I cannot honestly judge it yet.
          required: true

  - type: dropdown
    id: project_intent
    attributes:
      label: Project
      description: Project membership is explicit. Use the native Project picker when selecting the second option.
      options:
        - No project
        - Added to the appropriate project
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### What happens next

        A new human filing enters **Untriaged 📥**. Automation records filing
        provenance and initializes existing governed Project membership. Later
        triage owns parentage, relationships, Standalone, Slice, and homing.

  - type: checkboxes
    id: filing_gate
    attributes:
      label: Filing check
      options:
        - label: I searched open and closed issues for this capability.
          required: true
        - label: The title describes only the capability, without taxonomy or status markers.
          required: true
        - label: This feature has one independently verifiable outcome.
          required: true
