name: Task 🔨
description: Define one bounded, independently closable outcome.
type: Task 🔨
body:
  - type: markdown
    attributes:
      value: |
        ## Make one finishable promise

        Describe the result, not a proposed implementation. Keep the title to
        the work itself. Do not add type, status, domain, or homing markers.

        Agents file via `ghb issue create`, never this form.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this task is complete?
      placeholder: An operator can...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What happens now, and why is this task needed?
      placeholder: Today... This matters because...

  - type: textarea
    id: close_condition
    attributes:
      label: Close conditions
      description: List observable checks, not implementation steps.
      placeholder: |
        - [ ] The operator can...
        - [ ] The relevant check proves...

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What is deliberately outside this task?
      placeholder: This does not include...

  - type: markdown
    attributes:
      value: |
        ## Classify it in GitHub

        Before creating the issue, use the native controls below the form.
        Metadata in those controls is authoritative; these checks only record
        that you made the filing decision.

  - type: checkboxes
    id: domain_gate
    attributes:
      label: Domain
      description: Use the native Label picker. Repository-local labels may supplement, but do not replace, a governed domain label.
      options:
        - label: I applied at least one applicable governed domain label.

  - type: checkboxes
    id: priority_gate
    attributes:
      label: Priority
      description: Use the native Priority issue field. Priority is human judgment and automation will not infer it.
      options:
        - label: I set Priority, or intentionally left it blank because I cannot honestly judge it yet.

  - type: markdown
    attributes:
      value: |
        ### What happens next

        A new human filing enters **Untriaged 📥**. Automation records filing
        provenance and initializes existing governed Project membership. Later
        triage owns parentage, relationships, Standalone, Slice, and homing.

  - type: checkboxes
    id: filing_gate
    attributes:
      label: Filing check
      options:
        - label: I searched open and closed issues for the same outcome.
        - label: The title describes only the work, without taxonomy or status markers.
        - label: Another person has enough evidence to triage this issue.
