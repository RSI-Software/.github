name: CI

on:
  pull_request:
    paths: [.github/workflows/**, .github/actionlint.yaml, tests/**]
  push:
    branches: [main]
    paths: [.github/workflows/**, .github/actionlint.yaml, tests/**]

permissions:
  contents: read

jobs:
  actionlint:
    uses: ./.github/workflows/actionlint.yml
  k3s-deploy-tests:
    runs-on: ${{ vars.RSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install test prerequisites if missing
        run: |
          if ! command -v python3 >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3 jq
          fi
      - run: python3 -m unittest discover -s tests -v
