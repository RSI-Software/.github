name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [.github/workflows/**, .github/actionlint.yaml, actions/**, tests/**]
  push:
    branches: [main]
    paths: [.github/workflows/**, .github/actionlint.yaml, actions/**, tests/**]

permissions:
  contents: read

jobs:
  actionlint:
    uses: ./.github/workflows/actionlint.yml
  k3s-deploy-tests:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ${{ vars.RSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The runner image caches this version, so setup-node downloads nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # k3s-deploy renders manifests with Bun; the image bakes this version too.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install test prerequisites if missing
        run: |
          if ! command -v python3 >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3 jq
          fi
      - run: python3 -m unittest discover -s tests -v
