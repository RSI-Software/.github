# The one release route for k3s apps: build the caller's commit, push to the
# cluster registry, render/apply manifests, run Jobs, watch rollouts and smoke
# /health. Every node pulls built images with IfNotPresent; rollback preflights
# the registry before undoing the revision and restoring ConfigMap data.
# Registry retention is owned by infra (the latest 10 pushed tags per repo).
#
# Layer cache: the runner's root buildah store keeps each repository's latest
# build (layers up to a week old), so a build rewrites only the layers its
# change touches, and the registry and nodes receive only those. Only
# default-branch deploys build here; PR image checks run on ephemeral CI runners.
#
# Runner-host contract: buildah, jq, curl and k3s kubectl on PATH; deployer
# kubeconfig supplied by the caller. Buildah marks 192.168.1.231:5002 insecure;
# anonymous pulls work on every node. Push credentials are root-only on disk.
# Exact sudoers lines (both runners):
# /usr/bin/buildah bud *
# /usr/bin/buildah push --authfile /etc/k3s-deploy/registry-auth.json 192.168.1.231\:5002/* docker\://192.168.1.231\:5002/*
# /usr/bin/buildah rmi --force 192.168.1.231\:5002/*
# /usr/bin/buildah rmi --prune
name: k3s deploy

on:
  workflow_call:
    inputs:
      runner:
        description: Label of the app's node runner, appended to self-hosted (the repo-scoped runner per app)
        required: true
        type: string
      namespace:
        description: Default namespace for objects that name none, and for `deployments`
        required: true
        type: string
      images:
        description: >-
          JSON array of images to build, e.g.
          [{"repository": "docker.io/library/render-api", "dockerfile": "deploy/Dockerfile", "context": ".", "build-args": "COMMIT=..."}].
          Tag is the full commit SHA unless "tag" is set; a set tag already in the cluster registry is not rebuilt.
        required: true
        type: string
      manifests:
        description: >-
          Shell command, run in the checkout, that writes the app's manifests into $K3S_DEPLOY_OUT
          ($K3S_DEPLOY_SHA is set). Every image of a built repository uses its registry ref
          with IfNotPresent; Jobs run to completion first, then the rest applies server-side.
        required: false
        type: string
        default: ""
      deployments:
        description: 'JSON array of Deployment names to set images on, when there is no `manifests` command, e.g. ["render-server"]'
        required: false
        type: string
        default: "[]"
      health:
        description: >-
          JSON array of smokes curled from the runner, e.g.
          [{"url": "http://127.0.0.1:30882/api/health", "commit": ".commit"}];
          "commit" is a jq filter on the body that must yield this commit (12+ hex chars, prefix match).
        required: false
        type: string
        default: "[]"
      kubeconfig:
        description: Absolute path on the runner host of the deployer kubeconfig
        required: true
        type: string
      rollout-timeout:
        description: Timeout for each Job and each rollout status
        required: false
        type: string
        default: 10m
      timeout-minutes:
        description: Job timeout; raise it when a pod drains for long on shutdown
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One deploy at a time per app, across branches and reruns.
    concurrency:
      group: k3s-deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      KUBECONFIG: ${{ inputs.kubeconfig }}
      NAMESPACE: ${{ inputs.namespace }}
      SHA: ${{ github.sha }}
      REGISTRY: 192.168.1.231:5002
    steps:
      - name: Check out the commit under deploy
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the images
        env:
          IMAGES: ${{ inputs.images }}
          DEPLOYMENTS: ${{ inputs.deployments }}
          HEALTH: ${{ inputs.health }}
          MANIFESTS: ${{ inputs.manifests }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Builds here feed the layer cache every later deploy reuses.
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "k3s-deploy runs only from the default branch, not $GITHUB_REF" >&2; exit 2
          fi
          jq -e 'type == "array" and length > 0 and all(.[];
              (.repository | type == "string" and length > 0 and (test("[@\\s]|:[^/]*$") | not))
              and ((.tag // "x") | type == "string" and length > 0))' <<<"$IMAGES" >/dev/null \
            || { echo "images must be a non-empty array of {repository, dockerfile?, context?, build-args?, tag?}; repository carries no tag" >&2; exit 2; }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$DEPLOYMENTS" >/dev/null \
            || { echo "deployments must be a JSON array of names" >&2; exit 2; }
          jq -e 'type == "array" and all(.[]; (.url | type == "string") and (.commit | type == "string"))' <<<"$HEALTH" >/dev/null \
            || { echo "health must be a JSON array of {url, commit}" >&2; exit 2; }
          if [[ -z "$MANIFESTS" && "$DEPLOYMENTS" == "[]" ]]; then
            echo "set manifests or deployments: nothing would roll out" >&2; exit 2
          fi
          # One image mapping for manifests, deployments and rollback checks.
          cat > "$RUNNER_TEMP/k3s-images.jq" <<'JQ'
          def repository:
            sub("@.*$"; "") | sub(":[^:/]*$"; "")
            | sub("^([^/]*[.:][^/]*|localhost)/"; "") | sub("^library/"; "");
          def pin($images):
            walk(if type == "object" and (.image | type) == "string" then
              (.image | repository) as $repo
              | ([$images[] | select(.repository == $repo)] | first) as $image
              | if $image != null then .image = $image.ref | .imagePullPolicy = "IfNotPresent" else . end
            else . end);
          JQ
          jq -L "$RUNNER_TEMP" -c --arg sha "$SHA" --arg registry "$REGISTRY" '
            include "k3s-images";
            map(.repository |= repository | . + {ref: "\($registry)/\(.repository):\(.tag // $sha)"})' \
            <<<"$IMAGES" > "$RUNNER_TEMP/k3s-images.json"

      - name: Render the manifests
        if: inputs.manifests != ''
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k3s-manifests"
          rm -rf "$out" && mkdir -p "$out"
          K3S_DEPLOY_OUT="$out" K3S_DEPLOY_SHA="$SHA" bash -euo pipefail -c "$MANIFESTS"
          find "$out" -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) | grep -q . \
            || { echo "the manifests command wrote no manifests into \$K3S_DEPLOY_OUT" >&2; exit 1; }
          k3s kubectl create --dry-run=client -o json -R -f "$out" \
            | jq -cs '[.[] | if .kind == "List" then .items[] else . end]' > "$RUNNER_TEMP/k3s-raw.json"
          jq -L "$RUNNER_TEMP" -c --slurpfile images "$RUNNER_TEMP/k3s-images.json" '
            include "k3s-images"; pin($images[0])' \
            "$RUNNER_TEMP/k3s-raw.json" > "$RUNNER_TEMP/k3s-all.json"
          jq -c 'map(select(.kind == "Job"))' "$RUNNER_TEMP/k3s-all.json" > "$RUNNER_TEMP/k3s-jobs.json"
          jq -c '{apiVersion: "v1", kind: "List", items: map(select(.kind != "Job"))}' "$RUNNER_TEMP/k3s-all.json" > "$RUNNER_TEMP/k3s-apply.json"
          jq -r '.[] | "\(.kind)/\(.metadata.name)"' "$RUNNER_TEMP/k3s-all.json"
          # The server validates every object, admission and RBAC included,
          # before anything changes.
          k3s kubectl -n "$NAMESPACE" apply --server-side --force-conflicts --field-manager=k3s-deploy \
            --dry-run=server -f "$RUNNER_TEMP/k3s-apply.json" >/dev/null

      - name: Record the Deployments
        env:
          DEPLOYMENTS: ${{ inputs.deployments }}
          HAS_MANIFESTS: ${{ inputs.manifests != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_MANIFESTS" == true ]]; then
            jq -r --arg ns "$NAMESPACE" '.items[] | select(.kind == "Deployment") | "\(.metadata.namespace // $ns) \(.metadata.name)"' \
              "$RUNNER_TEMP/k3s-apply.json"
          else
            jq -r --arg ns "$NAMESPACE" '.[] | "\($ns) \(.)"' <<<"$DEPLOYMENTS"
          fi > "$RUNNER_TEMP/k3s-deployments.txt"
          # The revision before this deploy: rollback undoes only what moved.
          : > "$RUNNER_TEMP/k3s-revisions.txt"
          while read -r ns name; do
            rev=$(k3s kubectl -n "$ns" get deployment "$name" --ignore-not-found \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
            echo "$ns $name ${rev:-none}" >> "$RUNNER_TEMP/k3s-revisions.txt"
          done < "$RUNNER_TEMP/k3s-deployments.txt"
          cat "$RUNNER_TEMP/k3s-revisions.txt"
          # Live ConfigMaps this deploy changes: rollback restores their data,
          # since pods rolled back still mount the same objects.
          : > "$RUNNER_TEMP/k3s-configmaps.jsonl"
          if [[ "$HAS_MANIFESTS" == true ]]; then
            jq -r --arg ns "$NAMESPACE" '.items[] | select(.kind == "ConfigMap") | "\(.metadata.namespace // $ns) \(.metadata.name)"' \
              "$RUNNER_TEMP/k3s-apply.json" | while read -r ns name; do
              k3s kubectl -n "$ns" get configmap "$name" --ignore-not-found -o json \
                | jq -c '{apiVersion, kind, metadata: {name: .metadata.name, namespace: .metadata.namespace}, data, binaryData} | with_entries(select(.value != null))'
            done >> "$RUNNER_TEMP/k3s-configmaps.jsonl"
          fi

      - name: Build and push the images
        id: build
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/k3s-built.txt"
          # Buildah keys ARG by name and ENV by its unexpanded instruction.
          # Append a literal ENV in the final stage: only this metadata step
          # misses cache when the commit changes, even if all files are identical.
          printf 'ENV COMMIT=%s\n' "$SHA" > "$RUNNER_TEMP/k3s-commit.Containerfile"
          # Weekly, before building, drop dangling images: superseded build
          # stages and failed builds. This build's stages then seed the cache.
          mkdir -p "$HOME/.cache/k3s-deploy"
          if [[ -z $(find "$HOME/.cache/k3s-deploy/pruned" -mtime -7 2>/dev/null) ]]; then
            # Other jobs on a shared node may hold images; a refused prune never fails the deploy.
            sudo /usr/bin/buildah rmi --prune \
              || echo "::warning::buildah prune skipped images in use by other containers"
            touch "$HOME/.cache/k3s-deploy/pruned"
          fi
          while IFS= read -r img; do
            ref=$(jq -r .ref <<<"$img")
            if [[ $(jq -r '.tag != null' <<<"$img") == true ]] \
              && curl -sfI --connect-timeout 5 --max-time 15 \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "http://$REGISTRY/v2/$(jq -r .repository <<<"$img")/manifests/$(jq -r .tag <<<"$img")" >/dev/null; then
              echo "$ref already in the registry; not rebuilt"
              continue
            fi
            build_args=()
            while IFS= read -r pair; do
              if [[ -n "$pair" ]]; then build_args+=(--build-arg "$pair"); fi
            done < <(jq -r '.["build-args"] // ""' <<<"$img")
            echo "Building $ref"
            # chroot isolation survives the runner's hardened systemd unit.
            # Cached layers older than a week rebuild, so RUN steps pick up updates.
            sudo /usr/bin/buildah bud --isolation=chroot --layers --force-rm --cache-ttl=168h "${build_args[@]}" \
              -f "$(jq -r '.dockerfile // "Dockerfile"' <<<"$img")" \
              -f "$RUNNER_TEMP/k3s-commit.Containerfile" -t "$ref" "$(jq -r '.context // "."' <<<"$img")"
            # A built image is its repository's next cache, pushed or not.
            echo "$ref" >> "$RUNNER_TEMP/k3s-built.txt"
            sudo /usr/bin/buildah push --authfile /etc/k3s-deploy/registry-auth.json "$ref" "docker://$ref"
          done < <(jq -c '.[]' "$RUNNER_TEMP/k3s-images.json")

      # Each repository keeps its latest build as the layer cache. Removing the
      # previous one drops every layer that no other image still uses.
      - name: Rotate the layer cache
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            repo=${ref#"$REGISTRY/"}
            repo=${repo%:*}
            last="$HOME/.cache/k3s-deploy/last-${repo//\//_}"
            if [[ -f "$last" ]] && previous=$(<"$last") && [[ "$previous" != "$ref" ]]; then
              sudo /usr/bin/buildah rmi --force "$previous" \
                || echo "::warning::could not remove the previous build $previous"
            fi
            echo "$ref" > "$last"
          done < "$RUNNER_TEMP/k3s-built.txt"

      # Jobs (migrations) finish before any Deployment changes; a failed Job
      # stops the deploy with the running pods untouched.
      - name: Run the Jobs
        if: inputs.manifests != ''
        env:
          TIMEOUT: ${{ inputs.rollout-timeout }}
        run: |
          set -euo pipefail
          while IFS= read -r job; do
            ns=$(jq -r --arg ns "$NAMESPACE" '.metadata.namespace // $ns' <<<"$job")
            name=$(jq -r .metadata.name <<<"$job")
            echo "Running Job $ns/$name"
            k3s kubectl -n "$ns" delete job "$name" --ignore-not-found --wait=true
            k3s kubectl -n "$ns" apply --server-side --force-conflicts --field-manager=k3s-deploy -f - <<<"$job"
            # Done means a Complete or Failed condition; `timeout` bounds the wait.
            # shellcheck disable=SC2016 # the inner script expands its own arguments
            timeout "$TIMEOUT" bash -c '
              until conds=$(k3s kubectl -n "$0" get job "$1" -o jsonpath="{.status.conditions[?(@.status==\"True\")].type}") \
                && [[ " $conds " == *" Complete "* || " $conds " == *" Failed "* ]]; do sleep 5; done' "$ns" "$name" || true
            if [[ $(k3s kubectl -n "$ns" get job "$name" -o jsonpath='{.status.succeeded}') == 1 ]]; then
              echo "Job $ns/$name complete"
            else
              k3s kubectl -n "$ns" logs "job/$name" --tail=100 || true
              echo "::error::Job $ns/$name did not complete; nothing rolled out"
              exit 1
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/k3s-jobs.json")

      # Past this point Deployments change: later failures attempt a safe rollback.
      - name: Apply
        id: apply
        env:
          HAS_MANIFESTS: ${{ inputs.manifests != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_MANIFESTS" == true ]]; then
            k3s kubectl -n "$NAMESPACE" apply --server-side --force-conflicts --field-manager=k3s-deploy \
              -f "$RUNNER_TEMP/k3s-apply.json"
            exit 0
          fi
          while read -r ns name; do
            dep=$(k3s kubectl -n "$ns" get deployment "$name" -o json)
            patch=$(jq -L "$RUNNER_TEMP" -c --slurpfile images "$RUNNER_TEMP/k3s-images.json" '
              include "k3s-images";
              if any((.spec.template.spec.containers + (.spec.template.spec.initContainers // []))[];
                .image as $ref | any($images[0][]; .repository == ($ref | repository)))
              then pin($images[0]) | {spec: {template: {spec: .spec.template.spec}}}
              else error("deployment runs none of the built images") end' <<<"$dep")
            k3s kubectl -n "$ns" patch "deployment/$name" --type=merge -p "$patch"
          done < "$RUNNER_TEMP/k3s-deployments.txt"

      - name: Watch the rollouts
        env:
          TIMEOUT: ${{ inputs.rollout-timeout }}
        run: |
          set -euo pipefail
          while read -r ns name; do
            k3s kubectl -n "$ns" rollout status "deployment/$name" --timeout="$TIMEOUT"
          done < "$RUNNER_TEMP/k3s-deployments.txt"

      - name: Verify the running pods
        run: |
          set -euo pipefail
          while read -r ns name; do
            dep=$(k3s kubectl -n "$ns" get deployment "$name" -o json)
            # A worker another controller scales from 0 has no pods to check until it wakes.
            if [[ $(jq '.spec.replicas' <<<"$dep") == 0 ]]; then echo "$ns/$name scaled to 0"; continue; fi
            selector=$(jq -er '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$dep")
            # Ignore terminal pods and pods still draining (preStop) from older
            # ReplicaSets. Every remaining pod is Running and ready with the
            # template's commit-pinned images.
            k3s kubectl -n "$ns" get pods -l "$selector" -o json \
              | jq -L "$RUNNER_TEMP" -e --argjson tpl "$(jq -c '[.spec.template.spec.containers[].image]' <<<"$dep")" \
                     --slurpfile images "$RUNNER_TEMP/k3s-images.json" '
                  include "k3s-images";
                  .items |= map(select(.status.phase != "Failed" and .status.phase != "Succeeded" and .metadata.deletionTimestamp == null))
                  | all($tpl[]; . as $ref | all($images[0][]; .repository != ($ref | repository) or .ref == $ref))
                  and (.items | length) > 0
                  and all(.items[]; . as $pod |
                    $pod.status.phase == "Running"
                    and all($pod.spec.containers[]; . as $c | any($tpl[]; . == $c.image))
                    and (($pod.status.containerStatuses // []) | length == ($pod.spec.containers | length))
                    and all($pod.status.containerStatuses[]; .ready == true))' >/dev/null \
              || { echo "$ns/$name pods do not all serve this commit's images" >&2; exit 1; }
            echo "$ns/$name serves $SHA"
          done < "$RUNNER_TEMP/k3s-deployments.txt"

      - name: Smoke /health for the commit
        if: inputs.health != '[]'
        env:
          HEALTH: ${{ inputs.health }}
        run: |
          set -euo pipefail
          while IFS= read -r check; do
            url=$(jq -r .url <<<"$check")
            filter=$(jq -r .commit <<<"$check")
            got=""
            for _ in $(seq 1 24); do
              if body=$(curl -fsS --connect-timeout 5 --max-time 10 "$url" 2>/dev/null) \
                && got=$(jq -er "$filter" <<<"$body" 2>/dev/null) \
                && [[ ${#got} -ge 12 && ( "$SHA" == "$got"* || "$got" == "$SHA"* ) ]]; then
                echo "$url reports $got"
                continue 2
              fi
              sleep 5
            done
            echo "::error::$url never reported $SHA (last: ${got:-no answer})"
            exit 1
          done < <(jq -c '.[]' <<<"$HEALTH")

      - name: Roll back on failure
        if: failure() && steps.apply.outcome != 'skipped' && steps.apply.outcome != ''
        run: |
          set -uo pipefail
          # Preflight the whole rollback before restoring shared ConfigMap data.
          # An unsafe target leaves the current Deployments and ConfigMaps intact.
          : > "$RUNNER_TEMP/k3s-rollback.txt" || exit 1
          while read -r ns name before; do
            if ! dep=$(k3s kubectl -n "$ns" get deployment "$name" --ignore-not-found -o json); then
              echo "::error::rollback skipped: cannot read $ns/$name"
              exit 1
            fi
            now=$(jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // ""' <<<"$dep")
            if [[ "$before" == none ]]; then
              echo "::warning::$ns/$name is new in this deploy; left in place"
            elif [[ -n "$now" && "$now" != "$before" ]]; then
              # Use the exact owned revision, not another Deployment's history.
              if ! target=$(k3s kubectl -n "$ns" get replicasets -o json \
                | jq -ce --arg uid "$(jq -r .metadata.uid <<<"$dep")" --arg rev "$before" '
                    [.items[] | select(any(.metadata.ownerReferences[]?;
                      .uid == $uid and .kind == "Deployment" and .controller == true))
                    | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $rev)]
                    | if length == 1 then .[0].spec.template.spec
                      else error("target revision unavailable or ambiguous") end'); then
                echo "::error::rollback skipped: cannot resolve $ns/$name revision $before"
                exit 1
              fi
              if ! refs=$(jq -L "$RUNNER_TEMP" -r --slurpfile images "$RUNNER_TEMP/k3s-images.json" '
                include "k3s-images";
                [(.containers + (.initContainers // []))[].image
                  | . as $ref | select(any($images[0][]; .repository == ($ref | repository)))]
                | unique | .[]' <<<"$target"); then
                echo "::error::rollback skipped: cannot read $ns/$name revision $before images"
                exit 1
              fi
              while IFS= read -r ref; do
                [[ -n "$ref" ]] || continue
                # Legacy node-import refs cannot be pulled from this registry.
                path=${ref#*/}
                if [[ "$path" == *@* ]]; then path=${path/@/\/manifests\/}; else path=${path/:/\/manifests\/}; fi
                if [[ "$ref" != "$REGISTRY/"* ]] \
                  || ! curl -sfI --connect-timeout 5 --max-time 15 \
                    -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                    "http://$REGISTRY/v2/$path" >/dev/null; then
                  echo "::error::rollback skipped: $ns/$name revision $before image $ref unavailable in registry"
                  exit 1
                fi
              done <<<"$refs"
              echo "$ns $name $before" >> "$RUNNER_TEMP/k3s-rollback.txt" || exit 1
            fi
          done < "$RUNNER_TEMP/k3s-revisions.txt"
          while IFS= read -r cm; do
            k3s kubectl apply --server-side --force-conflicts --field-manager=k3s-deploy -f - <<<"$cm" \
              && echo "::error::deploy failed; restored ConfigMap $(jq -r '"\(.metadata.namespace)/\(.metadata.name)"' <<<"$cm")"
          done < "$RUNNER_TEMP/k3s-configmaps.jsonl"
          while read -r ns name before; do
            k3s kubectl -n "$ns" rollout undo "deployment/$name" --to-revision="$before" \
              && echo "::error::deploy failed; rolled $ns/$name back to revision $before"
          done < "$RUNNER_TEMP/k3s-rollback.txt"
