# The release route for k3s apps: tag the commit <prefix><N>, build once on a CI lane, push
# to zot, render the manifests with the pushed digests, and post them to k3s-hq in one
# OIDC-signed call. A promotion (`source`) skips the build and posts the digests zot holds for
# the commit, which k3s-hq admits only if the source's last pass ran them.
# No buildah, kubectl or kubeconfig. Callers and contract: docs/k3s-deploy.md.
#
# Layer cache: each repository keeps `<repository>:cache` in zot, max mode, on top of
# the node-local buildkitd-main cache. Any ARC job can push it, as any branch could
# `sudo buildah` on the old path; what runs is the digest this job built and k3s-hq pins.
name: k3s deploy

on:
  workflow_call:
    inputs:
      app:
        description: k3s-hq app record name; the record's repository must be the caller
        required: true
        type: string
      images:
        description: >-
          JSON array of images to build, or with source to promote, e.g.
          [{"repository": "render-api", "dockerfile": "deploy/Dockerfile", "context": ".", "build-args": "COMMIT=..."}].
          Each pushes as 192.168.1.231:5002/<repository>:<commit>; repository carries no tag.
          Each build also gets build-arg K3S_DEPLOY_REVISION=<revision tag>, before its own build-args.
        required: true
        type: string
      manifests:
        description: >-
          Shell command, run in the checkout, that writes the app's YAML or JSON manifests into
          $K3S_DEPLOY_OUT ($K3S_DEPLOY_SHA and $K3S_DEPLOY_REVISION are set). Each image of a built or promoted repository
          becomes its digest; every other image must already be by digest.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout; cover a cold build plus the release's migrations and rollouts
        required: false
        type: number
        default: 30
      prefix:
        description: Revision tag prefix; each released commit is tagged <prefix><N>, e.g. r12 or shipped/r56
        required: false
        type: string
        default: r
      source:
        description: >-
          Promote: a k3s-hq app of the same repository whose last pass ran this commit. Nothing builds;
          each images repository resolves to zot's <repository>:<commit> digest, which k3s-hq admits
          only if that pass ran it.
        required: false
        type: string
        default: ""
    outputs:
      revision:
        description: The released commit's revision tag, e.g. r12
        value: ${{ jobs.tag.outputs.revision }}

permissions:
  contents: read

jobs:
  # One revision per released commit, tagged before the build: a rerun reuses the commit's tag,
  # a new commit takes the highest number plus one, so a rolled-back number is never reused.
  # Its own job, one step and no checkout: the only place contents: write and actions: write reach.
  tag:
    runs-on: ci
    timeout-minutes: 5
    permissions:
      contents: write
      # Hands an overtaken release to the caller's run on main.
      actions: write
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      # Creating a ref that exists is a 422: a concurrent deploy took the number, so reread.
      - name: Tag the revision
        id: tag
        env:
          PREFIX: ${{ inputs.prefix }}
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          # The caller's workflow, even inside this reusable one.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # k3s-hq admits only main's tokens; fail before tagging or building.
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "k3s-hq releases only refs/heads/main, not $GITHUB_REF" >&2; exit 2
          fi
          if [[ ! "$PREFIX" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "prefix takes letters, digits and . _ / -, not '$PREFIX'" >&2; exit 2
          fi
          # The token rides git's environment, never argv.
          GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0
          # GITHUB_TOKEN may not tag a commit whose workflow files differ from main's head: a 403 once main is past this commit.
          overtaken() {
            curl -sS --max-time 30 -H @- -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SHA...main" <<<"Authorization: Bearer $GITHUB_TOKEN" \
              | jq -e '.status == "ahead"' >/dev/null
          }
          revision=""
          for _ in 1 2 3 4 5; do
            # Annotated tags list twice; the peeled ^{} line carries the commit.
            refs=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$PREFIX*")
            last=0
            while read -r sha ref; do
              name=${ref#refs/tags/}
              name=${name%"^{}"}
              n=${name#"$PREFIX"}
              if [[ ! "$n" =~ ^[0-9]+$ ]]; then continue; fi
              if [[ "$sha" == "$SHA" ]]; then revision=$name; fi
              if (( 10#$n > last )); then last=$((10#$n)); fi
            done <<<"$refs"
            if [[ -n "$revision" ]]; then
              echo "$SHA is already $revision"; break
            fi
            next="$PREFIX$((last + 1))"
            status=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/k3s-tag.json" -w '%{http_code}' -H @- \
              -H 'Accept: application/vnd.github+json' -X POST \
              --data "{\"ref\": \"refs/tags/$next\", \"sha\": \"$SHA\"}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" <<<"Authorization: Bearer $GITHUB_TOKEN")
            if [[ "$status" == 201 ]]; then
              revision=$next; echo "Tagged $SHA $revision"; break
            fi
            # Re-run the caller on main, whose head carries this change: its path filters may never start a run for it.
            if [[ "$status" == 403 ]] && overtaken; then
              file=${WORKFLOW_REF%@*}
              file=${file##*/}
              curl -fsS --max-time 30 -H @- -H 'Accept: application/vnd.github+json' -X POST --data '{"ref": "main"}' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$file/dispatches" <<<"Authorization: Bearer $GITHUB_TOKEN"
              echo "::notice::main moved past $SHA, so it cannot take a tag; $file re-runs on main to release it"
              echo "Handed off: $file re-runs on main" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" != 422 ]]; then
              echo "::error::tagging $next: HTTP $status $(cat "$RUNNER_TEMP/k3s-tag.json")"; exit 1
            fi
            echo "$next was taken; rereading the tags"
          done
          if [[ -z "$revision" ]]; then
            echo "::error::no free $PREFIX<N> tag after 5 tries"; exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Revision $revision" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    # No revision: the tag job handed this commit to the caller's run on main.
    if: needs.tag.outputs.revision != ''
    # A plain ARC pod: buildkitd, zot and the LAN k3s.rsi.nz are reachable from inside the cluster.
    runs-on: ci
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One release at a time per app; k3s-hq refuses another commit's while one runs.
    concurrency:
      group: k3s-deploy-${{ github.repository }}-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ inputs.app }}
      SOURCE: ${{ inputs.source }}
      SHA: ${{ github.sha }}
      K3S_DEPLOY_REVISION: ${{ needs.tag.outputs.revision }}
      REGISTRY: 192.168.1.231:5002
      RELEASES: https://k3s.rsi.nz/api/releases
    steps:
      - name: Check the inputs
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[];
              .repository | type == "string" and length > 0 and (test("[@\\s]|:[^/]*$") | not))' <<<"$IMAGES" >/dev/null \
            || { echo "images must be a non-empty array of {repository, dockerfile?, context?, build-args?}; repository carries no tag" >&2; exit 2; }
          # Every image pushes to zot: drop any registry host and `library/`.
          jq -c 'map(.repository |= (sub("^([^/]*[.:][^/]*|localhost)/"; "") | sub("^library/"; "")))' \
            <<<"$IMAGES" > "$RUNNER_TEMP/k3s-images.json"

      - name: Check out the commit under release
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The runner image bakes this version, so nothing downloads.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Build and push the images
        if: inputs.source == ''
        run: |
          set -euo pipefail
          if [[ -z "${RSI_REGISTRY_CONFIG:-}" || ! -r "$RSI_REGISTRY_CONFIG/config.json" ]]; then
            echo "::error::ARC registry auth config is not mounted or readable"; exit 1
          fi
          export DOCKER_CONFIG="$RSI_REGISTRY_CONFIG" BUILDX_CONFIG="$RUNNER_TEMP/buildx"
          docker buildx create --name k3s-deploy --driver remote tcp://buildkitd-main.buildkit.svc.cluster.local:1234 --use
          : > "$RUNNER_TEMP/k3s-built.jsonl"
          while IFS= read -r img; do
            ref="$REGISTRY/$(jq -r .repository <<<"$img")"
            # The caller's own build-args come after, so they win.
            args=(--build-arg "K3S_DEPLOY_REVISION=$K3S_DEPLOY_REVISION")
            while IFS= read -r pair; do
              if [[ -n "$pair" ]]; then args+=(--build-arg "$pair"); fi
            done < <(jq -r '.["build-args"] // ""' <<<"$img")
            echo "Building $ref:$SHA"
            # A cache export failure never fails the release.
            docker buildx build "$(jq -r '.context // "."' <<<"$img")" \
              --file "$(jq -r '.dockerfile // "Dockerfile"' <<<"$img")" "${args[@]}" \
              --platform linux/amd64 --provenance=false \
              --cache-from "type=registry,ref=$ref:cache,registry.insecure=true" \
              --cache-to "type=registry,ref=$ref:cache,mode=max,image-manifest=true,oci-mediatypes=true,registry.insecure=true,ignore-error=true" \
              --output "type=image,name=$ref:$SHA,push=true,registry.insecure=true" \
              --metadata-file "$RUNNER_TEMP/k3s-build.json"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/k3s-build.json")
            jq -c --arg digest "$digest" '{repository, digest: $digest}' <<<"$img" >> "$RUNNER_TEMP/k3s-built.jsonl"
            echo "$ref:$SHA is $ref@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' "$RUNNER_TEMP/k3s-images.json")

      # The source's release pushed <repository>:<commit>; k3s-hq refuses a digest its pass never ran.
      - name: Resolve the promoted images
        if: inputs.source != ''
        run: |
          set -euo pipefail
          auth=$(jq -er --arg r "$REGISTRY" '.auths[$r].auth' "$RSI_REGISTRY_CONFIG/config.json" 2>/dev/null) \
            || { echo "::error::ARC registry auth config has no $REGISTRY login"; exit 1; }
          : > "$RUNNER_TEMP/k3s-built.jsonl"
          while IFS= read -r repository; do
            # HEAD by tag; the auth rides stdin, never argv.
            digest=$(curl -fsSI --max-time 30 -H @- \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "http://$REGISTRY/v2/$repository/manifests/$SHA" <<<"Authorization: Basic $auth" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }') || digest=""
            if [[ -z "$digest" ]]; then
              echo "::error::zot has no $repository:$SHA to promote; $SOURCE never released this commit"; exit 1
            fi
            jq -nc --arg repository "$repository" --arg digest "$digest" '{$repository, $digest}' >> "$RUNNER_TEMP/k3s-built.jsonl"
            echo "$REGISTRY/$repository:$SHA is $REGISTRY/$repository@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[].repository' "$RUNNER_TEMP/k3s-images.json")

      - name: Render the manifests
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k3s-manifests"
          rm -rf "$out" && mkdir -p "$out"
          K3S_DEPLOY_OUT="$out" K3S_DEPLOY_SHA="$SHA" bash -euo pipefail -c "$MANIFESTS"
          K3S_DEPLOY_OUT="$out" bun run - <<'TS'
          const { APP, SOURCE, REGISTRY, RUNNER_TEMP, K3S_DEPLOY_OUT } = process.env as Record<string, string>;
          const fail = (message: string): never => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          /** A ref's repository, without registry host, tag, digest or `library/`. */
          const repository = (ref: string) =>
            ref
              .replace(/@.*$/, "")
              .replace(/:[^:/]*$/, "")
              .replace(/^([^/]*[.:][^/]*|localhost)\//, "")
              .replace(/^library\//, "");
          const built = new Map<string, string>();
          for (const line of (await Bun.file(`${RUNNER_TEMP}/k3s-built.jsonl`).text()).split("\n")) {
            if (!line) continue;
            const { repository: name, digest } = JSON.parse(line);
            built.set(repository(name), `${REGISTRY}/${name}@${digest}`);
          }
          const objects: Record<string, any>[] = [];
          const files = [...new Bun.Glob("**/*.{yaml,yml,json}").scanSync(K3S_DEPLOY_OUT)].sort();
          for (const file of files) {
            // A multi-document file parses to an array; JSON is YAML.
            const parsed = Bun.YAML.parse(await Bun.file(`${K3S_DEPLOY_OUT}/${file}`).text());
            for (const doc of [parsed].flat()) {
              if (doc == null) continue;
              objects.push(...(doc.kind === "List" ? (doc.items ?? []) : [doc]));
            }
          }
          if (!objects.length) fail("the manifests command wrote no manifests into $K3S_DEPLOY_OUT");
          const used = new Set<string>();
          const pin = (node: unknown): void => {
            if (Array.isArray(node)) return node.forEach(pin);
            if (typeof node !== "object" || node === null) return;
            const object = node as Record<string, unknown>;
            if (typeof object.image === "string") {
              const ref = built.get(repository(object.image));
              if (ref) {
                object.image = ref;
                used.add(ref);
              }
            }
            Object.values(object).forEach(pin);
          };
          pin(objects);
          for (const ref of built.values())
            if (!used.has(ref)) console.log(`::warning::no manifest runs ${ref}`);
          for (const o of objects) console.log(`${o.kind}/${o.metadata?.name}`);
          await Bun.write(`${RUNNER_TEMP}/k3s-release.json`, JSON.stringify({ app: APP, objects, source: SOURCE || undefined }));
          TS

      # One call; the reply is NDJSON heartbeats ending in the result. A refusal, a failed
      # result, or a stream that ends without a result turns this red. A rerun reposts:
      # this commit's running or released release attaches.
      - name: Release through k3s-hq
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::no OIDC token: the calling job grants id-token: write"; exit 1
          fi
          token=$(curl -sSf --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=k3s-hq" | jq -er .value)
          echo "::add-mask::$token"
          log="$RUNNER_TEMP/k3s-release.ndjson"
          headers="$RUNNER_TEMP/k3s-release.headers"
          # A silent minute is a lost stream: heartbeats come every 3s. One in 20 prints.
          set +e
          curl -sS -N --connect-timeout 10 --speed-limit 1 --speed-time 60 -D "$headers" \
            -H @- -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/k3s-release.json" "$RELEASES" <<<"Authorization: Bearer $token" \
            | tee "$log" | awk '/"state":"running"/ { if (n++ % 20) next } { print; fflush() }'
          sent=${PIPESTATUS[0]}
          set -e
          status=$(awk 'toupper($1) ~ /^HTTP\// { code = $2 } END { print code }' "$headers" 2>/dev/null || true)
          last=$(grep -v '^[[:space:]]*$' "$log" 2>/dev/null | tail -n 1 || true)
          if jq -e '.state == "released"' <<<"$last" >/dev/null 2>&1; then
            echo "Released $APP at $SHA${SOURCE:+, promoted from $SOURCE}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$sent" != 0 ]]; then
            why="the reply ended without a result (curl exit $sent); rerun to attach"
          elif [[ "$status" != 200 ]]; then
            why="k3s-hq refused (HTTP ${status:-none}): ${last:-no body}"
          elif jq -e '.state == "failed"' <<<"$last" >/dev/null 2>&1; then
            why=$(jq -r '"failed at \(.stage // "start"), undo \(.undo): \(.error // "no error")"' <<<"$last")
          elif jq -e 'has("error")' <<<"$last" >/dev/null 2>&1; then
            why="k3s-hq lost the release status: $(jq -r .error <<<"$last"); rerun to attach"
          else
            why="the reply ended without a result; rerun to attach"
          fi
          echo "::error::$APP release: $why"
          echo "$APP release: $why" >> "$GITHUB_STEP_SUMMARY"
          exit 1
