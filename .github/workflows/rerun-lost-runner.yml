# Reruns each failed job that lost its self-hosted runner: an evicted, OOM-killed or
# drained runner pod, not a failing test. A real failure keeps the run red. Capped at
# 3 attempts. Callers grant `actions: write` and `checks: read`; see docs/rerun-lost-runner.md.
name: Rerun lost runners

on:
  workflow_call:

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Rerun jobs that lost their runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          DRY_RUN: "false"
        run: |
          set -euo pipefail
          lost='lost communication with the server|received a shutdown signal'
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # A job carried over from an earlier attempt keeps its first start time, so
          # each failed job is judged by the attempt that last ran it.
          declare -A ran_id
          for (( a = 1; a <= ATTEMPT; a++ )); do
            since=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$a" --jq .run_started_at)
            while IFS=$'\t' read -r id name; do ran_id[$name]=$id
            done < <(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$a/jobs" \
              --jq ".jobs[] | select(.started_at >= \"$since\") | [.id, .name] | @tsv")
          done

          lost_jobs=() real=0
          while IFS=$'\t' read -r id name; do
            messages=$(gh api "repos/$REPO/check-runs/${ran_id[$name]:-$id}/annotations" --jq '.[].message')
            # A drained pod cancels its job mid-step; a job timeout cancels it too, but says so.
            if grep -Eq "$lost" <<< "$messages" ||
              { grep -qx 'The operation was canceled.' <<< "$messages" &&
                ! grep -q 'exceeded the maximum execution time' <<< "$messages"; }; then
              lost_jobs+=("$id"$'\t'"$name")
            else
              real=$((real + 1))
            fi
          done < <(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv')

          note "### Rerun lost runners: [run $RUN]($RUN_URL), attempt $ATTEMPT"
          if (( ${#lost_jobs[@]} == 0 )); then
            note "No job lost its runner; $real failed on its own. Nothing to rerun."
            exit 0
          fi
          for job in "${lost_jobs[@]}"; do note "- lost its runner: ${job#*$'\t'}"; done

          if (( real == 0 )); then
            note "Rerunning all ${#lost_jobs[@]} lost jobs as attempt $((ATTEMPT + 1))."
            [[ "$DRY_RUN" == true ]] || gh run rerun "$RUN" --failed --repo "$REPO"
            exit 0
          fi
          # GitHub reruns one job per request and refuses while the run is active, so a
          # mixed run reruns one lost job per attempt; the run stays red on the real one.
          job=${lost_jobs[0]}
          note "$real job(s) failed on their own; the run stays red."
          note "Rerunning '${job#*$'\t'}' as attempt $((ATTEMPT + 1)); any other lost job follows next attempt."
          [[ "$DRY_RUN" == true ]] || gh api -X POST "repos/$REPO/actions/jobs/${job%%$'\t'*}/rerun" --silent
