# Reruns each job that lost its self-hosted runner or timed out: an evicted, drained or
# hard-killed runner pod, not a failing test. A real failure or a deliberate cancel gets
# no rerun. Each job runs at most 3 times. Callers grant `actions: write` and
# `checks: read`; see docs/rerun-lost-runner.md.
name: Rerun lost runners

on:
  workflow_call:

permissions: {}

jobs:
  rerun:
    if: contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Rerun jobs that lost their runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          DRY_RUN: "false"
        run: |
          set -euo pipefail
          lost='lost communication with the server|received a shutdown signal|exceeded the maximum execution time'
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # A job carried over from an earlier attempt keeps its first start time, so
          # each job is judged by the attempt that last ran it and counts only its own runs.
          declare -A ran_id runs
          for (( a = 1; a <= ATTEMPT; a++ )); do
            since=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$a" --jq .run_started_at)
            while IFS=$'\t' read -r id name; do ran_id[$name]=$id runs[$name]=$(( ${runs[$name]:-0} + 1 ))
            done < <(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$a/jobs" \
              --jq ".jobs[] | select(.started_at >= \"$since\") | [.id, .name] | @tsv")
          done

          lost_jobs=() real=0 kept=0
          while IFS=$'\t' read -r id name conclusion; do
            messages=$(gh api "repos/$REPO/check-runs/${ran_id[$name]:-$id}/annotations" --jq '.[].message')
            # A drained pod fails its job with a bare cancel; a cancelled job without a
            # timeout was stopped on purpose, by a newer run or by a failing sibling.
            if grep -Eq "$lost" <<< "$messages" ||
              { [[ "$conclusion" == failure ]] && grep -qxF 'The operation was canceled.' <<< "$messages"; }; then
              if (( ${runs[$name]:-1} < 3 )); then
                lost_jobs+=("$id"$'\t'"$name")
              else
                note "- ran 3 times, no more reruns: $name"
                real=$((real + 1))
              fi
            elif [[ "$conclusion" == failure ]]; then
              real=$((real + 1))
            elif [[ "$CONCLUSION" == cancelled ]]; then
              kept=$((kept + 1))
            fi
          done < <(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .name, .conclusion] | @tsv')

          note "### Rerun lost runners: [run $RUN]($RUN_URL), attempt $ATTEMPT"
          if (( ${#lost_jobs[@]} == 0 )); then
            note "No job to rerun; $real failed on their own, $kept canceled on purpose."
            exit 0
          fi
          for job in "${lost_jobs[@]}"; do note "- lost its runner or timed out: ${job#*$'\t'}"; done
          sleep 30

          if (( real + kept == 0 )) && [[ "$CONCLUSION" == failure ]]; then
            note "Rerunning all ${#lost_jobs[@]} lost jobs as attempt $((ATTEMPT + 1))."
            [[ "$DRY_RUN" == true ]] || gh run rerun "$RUN" --failed --repo "$REPO"
            exit 0
          fi
          # GitHub reruns one job per request and refuses while the run is active, so
          # the rest wait a run; `--failed` would also rerun deliberate cancels.
          job=${lost_jobs[0]}
          (( real + kept == 0 )) || note "$real job(s) failed on their own, $kept canceled on purpose; neither reruns."
          note "Rerunning '${job#*$'\t'}' as attempt $((ATTEMPT + 1)); any other lost job follows next attempt."
          [[ "$DRY_RUN" == true ]] || gh api -X POST "repos/$REPO/actions/jobs/${job%%$'\t'*}/rerun" --silent
