# Reruns a failed run's failed jobs when every one of them lost its self-hosted runner:
# an evicted, OOM-killed or drained runner pod, not a failing test. Capped at 3 attempts.
# Callers grant `actions: write` and `checks: read`, and call it only for failed runs;
# see docs/rerun-lost-runner.md.
name: Rerun lost runners

on:
  workflow_call:

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Rerun failed jobs that lost their runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DRY_RUN: "false"
        run: |
          set -euo pipefail
          lost='lost communication with the server|received a shutdown signal'
          mapfile -t failed < <(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"')
          if (( ${#failed[@]} == 0 )); then
            echo "No failed job in attempt $ATTEMPT; nothing to rerun."
            exit 0
          fi
          for job in "${failed[@]}"; do
            if ! gh api "repos/$REPO/check-runs/${job%% *}/annotations" --jq '.[].message' | grep -Eq "$lost"; then
              echo "Job '${job#* }' failed on its own; leaving run $RUN for a human."
              exit 0
            fi
            echo "Job '${job#* }' lost its runner."
          done
          echo "Every failed job lost its runner: rerunning attempt $((ATTEMPT + 1)) of run $RUN."
          [[ "$DRY_RUN" == true ]] || gh run rerun "$RUN" --failed --repo "$REPO"
